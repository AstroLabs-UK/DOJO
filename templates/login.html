<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOJO - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #483427;
    --paper: #DCC9AD;
    --paper-light: #EDE2CE;
    --streak: #D3B326;
    --capture: #C35258;
    --accent: #E99785;
    --verified: #106552;
    --verified-text: #F1ECDC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--paper-light);
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 40px 32px 32px;
  }
  .logo {
    display: block;
    height: 32px;
    width: auto;
    margin: 0 auto 24px;
  }
  .mark {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }
  .mark-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--verified);
    display: inline-block;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 14px;
    color: var(--ink);
    opacity: 0.7;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .rule {
    border: none;
    border-top: 1px dashed var(--ink);
    opacity: 0.4;
    margin: 24px 0;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="email"], input[type="password"] {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    border: 1.5px solid var(--ink);
    border-radius: 12px;
    background: var(--paper-light);
    color: var(--ink);
  }
  input::placeholder { color: var(--ink); opacity: 0.4; }
  input:focus {
    outline: 2px solid var(--verified);
    outline-offset: 1px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .checkbox-row input { width: 15px; height: 15px; accent-color: var(--verified); }
  .link {
    font-size: 13px;
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  button.primary {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    background: var(--verified);
    color: var(--verified-text);
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  button.primary:hover { opacity: 0.92; }
  .footer-text {
    text-align: center;
    font-size: 13px;
    margin-top: 20px;
  }
  .footer-text .link { font-weight: 600; }
  .streak-tag {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--streak);
    color: #3A2E00;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    margin-top: 10px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
</style>
</head>
