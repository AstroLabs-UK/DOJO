name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 0 */3 * *" # every 3 days
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_logs?select=*&order=created_at.desc&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY_PUBLIC }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY_PUBLIC }}"
